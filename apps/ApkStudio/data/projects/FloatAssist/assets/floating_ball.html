<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --color-primary: #6366f1;
    --color-primary-rgb: 99, 102, 241;
    --glow-opacity: 0.45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    margin: 0; overflow: hidden; background: transparent; 
    display: flex; align-items: center; justify-content: center; 
    height: 100vh; touch-action: none; user-select: none;
  }
  .orb-container {
    width: 100%; height: 100%; padding: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .orb-visual {
    width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.45) 0%, rgba(var(--color-primary-rgb), 0.25) 30%, rgba(var(--color-primary-rgb), 0.1) 50%, rgba(9, 9, 14, 0.92) 100%);
    box-shadow: 0 0 16px rgba(var(--color-primary-rgb), var(--glow-opacity)), 
                inset 0 3px 6px rgba(255, 255, 255, 0.35), 
                inset 0 -3px 8px rgba(0, 0, 0, 0.75), 
                inset -6px -6px 12px rgba(var(--color-primary-rgb), 0.15), 
                0 0 0 1px rgba(255,255,255,0.2);
    transform-origin: center center;
    transition: transform 0.1s ease-out;
  }
  .orb-sheen {
    position: absolute; top: 8%; left: 12%; width: 35%; height: 20%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%);
    border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%; transform: rotate(-12deg); filter: blur(0.3px);
  }
  .orb-bottom-glow {
    position: absolute; bottom: 10%; right: 15%; width: 45%; height: 35%;
    background: radial-gradient(circle, var(--color-primary) 0%, transparent 80%);
    opacity: 0.55; filter: blur(1.5px);
  }
  .orb-core {
    position: absolute; width: 14%; height: 14%; background: #ffffff; top: 43%; left: 43%;
    border-radius: 50%; box-shadow: 0 0 10px #ffffff, 0 0 20px var(--color-primary);
    opacity: 0.85; animation: orb-breathe 3s ease-in-out infinite;
  }
  @keyframes orb-breathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.35); opacity: 0.95; } }
</style>
</head>
<body>
  <div class="orb-container">
    <div class="orb-visual" id="orb">
      <div class="orb-sheen"></div>
      <div class="orb-bottom-glow"></div>
      <div class="orb-core"></div>
    </div>
  </div>
  <script>
    function syncSettings() {
        if(window.Service) {
            const hex = window.Service.getSettingString("ball_color", "#6366f1");
            const rgb = window.Service.getSettingString("ball_color_rgb", "99, 102, 241");
            const glow = window.Service.getSettingInt("ball_glow", 10) / 10.0;
            document.documentElement.style.setProperty('--color-primary', hex);
            document.documentElement.style.setProperty('--color-primary-rgb', rgb);
            
            // Map glow-intensity strictly to the opacity of a fixed-size shadow (caps at 0.95)
            const opacity = Math.min(0.95, 0.45 * glow);
            document.documentElement.style.setProperty('--glow-opacity', opacity);
        }
    }
    function setDeformation(stretchX, stretchY, angle) {
        document.getElementById('orb').style.transform = `rotate(${angle}deg) scale(${stretchX}, ${stretchY}) rotate(${-angle}deg)`;
    }
    function resetDeformation() {
        document.getElementById('orb').style.transform = `scale(1)`;
    }
    function squeeze() {
        document.getElementById('orb').style.transform = `scale(0.85)`;
    }
    document.addEventListener("DOMContentLoaded", syncSettings);
  </script>
</body>
</html>
